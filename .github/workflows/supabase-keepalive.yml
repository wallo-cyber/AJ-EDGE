name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch: {}

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth health endpoint
        run: |
          echo "Pinging Supabase project to keep it active..."
          curl -sS -o /dev/null -w "HTTP status: %{http_code}\n" \
            --request GET \
            --url "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
            --header "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
